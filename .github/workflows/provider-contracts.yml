name: Provider contract fixtures

on:
  push:
    paths: ['packages/adapter-*/**', 'packages/core/**', 'packages/protocol/**']
  pull_request:
    paths: ['packages/adapter-*/**', 'packages/core/**', 'packages/protocol/**']

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm catalog:validate
