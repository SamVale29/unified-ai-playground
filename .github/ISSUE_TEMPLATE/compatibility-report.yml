name: Compatibility report
description: Report a provider/model compatibility observation
title: 'compatibility: '
labels: [compatibility]
body:
  - type: input
    id: provider
    attributes:
      label: Provider and exact model ID
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source
    validations:
      required: true
  - type: textarea
    id: experiment
    attributes:
      label: Reproducible experiment
      description: Attach a sanitized experiment JSON, never keys or private prompts.
    validations:
      required: true
